title: runtime质量论
tagline: Agent Reliability · Harness · AI Testing · Runtime Quality
description: 研究 AI 系统从生成、执行、验证到交付过程中的可靠性问题，记录 Agent Harness、AI Eval、Trace、Failure Regression 与 Quality Gate 的工程实践。
url: https://hugfeature.github.io
baseurl: ""
theme: minima
lang: zh-CN
locale: zh_CN
timezone: Asia/Shanghai
author:
  name: hugfeature
  url: https://hugfeature.github.io/about/
social:
  name: hugfeature
  links:
    - https://github.com/hugfeature
plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
# Paste real verification tokens here after creating the search properties.
webmaster_verifications:
  google: ""
  bing: ""
defaults:
  - scope:
      path: ""
    values:
      image: /assets/social-card.png
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      toc: true
      seo:
        type: BlogPosting
exclude:
  - README.md
  - AUDIT.md
  - VALIDATION.md
  - Gemfile
  - Gemfile.lock
  - scripts
  - vendor
  - node_modules
